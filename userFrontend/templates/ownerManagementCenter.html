{% extends "ownerUsersPage.html" %}
{% block body %}

<div class="sm:w-[85%] min-h-screen  ml-[18%] mr-6 mt-[3%] flex flex-col ">

    <!-- tabs -->
    <div class="tabs fixed flex flex-col w-full h-[full] md:w-[80%]" >

        <!-- tabs header -->
        <div class="relative flex flex-row items-center border-b-2 bg-gray-800 dark:border-gray-700" style="
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(8.8px);
        -webkit-backdrop-filter: blur(8.8px);
        border: 1px solid rgba(255, 255, 255, 0.26);"> 
            <a data-type="tabs" data-target="tab-4" href="{% url 'addProperty' %}"
                class="active flex-1 h-16 px-4 flex flex-col justify-center items-center gap-1 relative py-2 hover:bg-surface-100 dark:hover:bg-surfacedark-100 text-gray-700 dark:text-gray-300">
                <span class="material-symbols-outlined">New Properties</span>
                <p class="text-sm tracking-[.00714em]">Add Up</p>
            </a>
            <a data-type="tabs" data-target="tab-5" href="{% url 'modifyPropertyPage' %}"
                class="flex-1 h-16 px-4 flex flex-col justify-center items-center gap-1 relative py-2 hover:bg-surface-100 dark:hover:bg-surfacedark-100 text-gray-700 dark:text-gray-300">
                <span class="material-symbols-outlined">Other actions center</span>
                <p class="text-sm tracking-[.00714em]">Remake UP</p>
            </a>
            <hr><br>
            <!-- indicator -->
            <div role="indicator"
                class="absolute bottom-0 transition-all duration-200 ease-in-out bg-gray-500 dark:bg-primary-200 h-[0.4rem] rounded-t-full">
            </div>
        </div>

    </div>
    
    {% block content %}
    <!-- tabs content -->
    <div class="flex flex-col overflow-y-auto mt-[2%] ">
        
    </div>
    {% endblock content %}
   
</div>



{% endblock body %}
